<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc">
  <title>Sponsorloop Live</title>
  <script>
    try {
      var t = localStorage.getItem('sponsorloop_theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (t === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
<body class="min-h-[100dvh] text-slate-800 dark:text-slate-100 transition-colors duration-300">
  <div id="app"></div>
  <canvas id="confetti" class="fixed inset-0 pointer-events-none z-50"></canvas>
  <script type="module" src="/src/stream/main.js"></script>
</body>
</html>
