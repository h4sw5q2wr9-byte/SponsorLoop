      body {

      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Glassmorphism utilities */
      .glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      /* Solid dark mode cards to match popups */
      .glass-dark {
        background: #1e293b !important; /* Slate 800 - important to override glass transparency */
        border: 1px solid #334155 !important; /* Slate 700 */
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      /* Animations */
      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
      .animate-pop {
        animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes pop-down {
        0% { transform: scale(1); }
        50% { transform: scale(0.85); }
        100% { transform: scale(1); }
      }
      .animate-pop-down {
        animation: pop-down 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes slide-up-fade {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slide-up-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
      
      @keyframes sheen {
        0% { transform: translateX(-100%) skewX(-15deg); }
        100% { transform: translateX(200%) skewX(-15deg); }
      }
      .animate-sheen {
        animation: sheen 2s infinite linear;
      }

      /* Subtler pulse for icons */
      @keyframes pulse-scale {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.9; }
      }
      .animate-pulse-scale {
        animation: pulse-scale 3s ease-in-out infinite;
      }
